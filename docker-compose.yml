services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: seapilot
      POSTGRES_USER: seapilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seapilot_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - seapilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seapilot -d seapilot"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  seapilot_postgres:
