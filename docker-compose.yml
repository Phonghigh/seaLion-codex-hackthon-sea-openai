services:
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # Local demo default only.
      POSTGRES_DB: seapilot
    volumes:
      - seapilot_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seapilot"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  seapilot_db:
